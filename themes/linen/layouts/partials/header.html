<header class="site-head">
  <a class="brand" href="{{ "/" | relURL }}">
    <span class="mark" aria-hidden="true"></span>{{ site.Title }}
  </a>
  <nav class="nav">
    {{ range site.Menus.main }}<a href="{{ .URL }}">{{ .Name }}</a>{{ end }}
    <button class="theme-toggle" type="button" aria-label="Toggle dark mode">◐</button>
  </nav>
</header>
